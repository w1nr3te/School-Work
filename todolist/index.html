<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESONANCE — Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">Edit Task</h2>
        <button class="modal-close" id="modal-close-btn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <label for="edit-title" class="form-label">Task Title <span class="required">*</span></label>
        <input type="text" id="edit-title" class="form-input" placeholder="Task title..." maxlength="120" />
        <label for="edit-desc" class="form-label" style="margin-top:14px;">Description <span class="optional">(optional)</span></label>
        <textarea id="edit-desc" class="form-input form-textarea" placeholder="Add details..." maxlength="400" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="modal-save-btn">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
    <div class="modal-box modal-box--sm">
      <div class="modal-header">
        <h2 id="confirm-title">Delete Task?</h2>
      </div>
      <div class="modal-body">
        <p class="confirm-text">This action cannot be undone. The task will be permanently removed.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="confirm-cancel-btn">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- App Wrapper -->
  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-inner">
        <div class="header-brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="none" stroke="#56CCF2" stroke-width="1.5"/>
              <polygon points="14,7 21,11 21,17 14,21 7,17 7,11" fill="rgba(86,204,242,0.15)" stroke="#8FD3FE" stroke-width="1"/>
              <circle cx="14" cy="14" r="2.5" fill="#56CCF2"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">RESONANCE</h1>
            <p class="brand-sub">Task Coordinator</p>
          </div>
        </div>
        <div class="header-date" id="header-date" aria-label="Current date"></div>
      </div>
    </header>

    <main class="app-main" role="main">

      <!-- Stats Dashboard -->
      <section class="section" aria-label="Task Statistics">
        <div class="stats-grid">
          <div class="stat-card" data-stat="total">
            <div class="stat-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </div>
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
          <div class="stat-card" data-stat="active">
            <div class="stat-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-value" id="stat-active">0</div>
            <div class="stat-label">Active</div>
          </div>
          <div class="stat-card" data-stat="completed">
            <div class="stat-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="stat-value" id="stat-completed">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card" data-stat="percent">
            <div class="stat-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            </div>
            <div class="stat-value" id="stat-percent">0%</div>
            <div class="stat-label">Completion</div>
          </div>
        </div>
      </section>

      <!-- Progress Bar -->
      <section class="section" aria-label="Overall Progress">
        <div class="progress-card">
          <div class="progress-header">
            <span class="progress-label">Overall Progress</span>
            <span class="progress-value" id="progress-value">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-glow" id="progress-glow"></div>
          </div>
        </div>
      </section>

      <!-- Task Creation -->
      <section class="section" aria-label="Create New Task">
        <div class="create-card">
          <div class="create-header">
            <span class="section-title">New Task</span>
          </div>
          <div class="create-body">
            <div class="input-group">
              <label for="task-title" class="form-label">Task Title <span class="required">*</span></label>
              <input
                type="text"
                id="task-title"
                class="form-input"
                placeholder="What needs to be done?"
                maxlength="120"
                aria-required="true"
                autocomplete="off"
              />
            </div>
            <div class="input-group">
              <label for="task-desc" class="form-label">Description <span class="optional">(optional)</span></label>
              <textarea
                id="task-desc"
                class="form-input form-textarea"
                placeholder="Add more details..."
                maxlength="400"
                rows="2"
              ></textarea>
            </div>
            <button class="btn btn-primary btn-add" id="add-task-btn" aria-label="Add new task">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Task
            </button>
          </div>
        </div>
      </section>

      <!-- Task Controls -->
      <section class="section section--controls" aria-label="Search and Filter Tasks">
        <div class="controls-row">
          <div class="search-wrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
              type="search"
              id="search-input"
              class="form-input search-input"
              placeholder="Search tasks..."
              aria-label="Search tasks"
              autocomplete="off"
            />
          </div>
          <div class="selects-row">
            <div class="select-wrap">
              <label for="filter-select" class="sr-only">Filter tasks</label>
              <select id="filter-select" class="form-select" aria-label="Filter tasks">
                <option value="all">All Tasks</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="select-wrap">
              <label for="sort-select" class="sr-only">Sort tasks</label>
              <select id="sort-select" class="form-select" aria-label="Sort tasks">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="alpha">Alphabetical</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- Task List -->
      <section class="section" aria-label="Task List" aria-live="polite">
        <div id="task-list" class="task-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
              <polygon points="28,4 52,16 52,40 28,52 4,40 4,16" fill="none" stroke="#56CCF2" stroke-width="1.5" opacity="0.4"/>
              <polygon points="28,14 42,21 42,35 28,42 14,35 14,21" fill="none" stroke="#8FD3FE" stroke-width="1" opacity="0.25"/>
              <line x1="28" y1="21" x2="28" y2="35" stroke="#56CCF2" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
              <line x1="21" y1="28" x2="35" y2="28" stroke="#56CCF2" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="empty-title">No tasks yet</p>
          <p class="empty-sub">Start organizing your journey.</p>
        </div>
      </section>

    </main>

    <footer class="app-footer" role="contentinfo">
      <p>RESONANCE &mdash; Built with focus &amp; intention</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
